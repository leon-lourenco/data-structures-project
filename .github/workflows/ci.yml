name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to the same branch cancels whatever CI run is already in flight for it - no point
# burning minutes finishing a build for a commit that's already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pages: write
  id-token: write

jobs:
  # Compiles every module, runs every test, generates every module's JaCoCo report. JMH
  # benchmarks are deliberately NOT run here: shared CI runners have noisy, inconsistent
  # performance, so a benchmark number from this environment wouldn't mean anything - that's
  # exactly why the numbers quoted in every module's README come from a real local run instead.
  # `./gradlew jmh` stays a manual, on-demand command.
  build-test:
    uses: leon-lourenco/ci-templates/.github/workflows/gradle-build-test.yml@master
    with:
      java-version: '26'

  codeql:
    uses: leon-lourenco/ci-templates/.github/workflows/codeql-java.yml@master
    with:
      java-version: '26'

  # Publishes every module's coverage report to GitHub Pages - only on an actual push to
  # master, never on a pull request (a PR from a fork couldn't deploy anyway, and there's no
  # reason to redeploy Pages for a branch that isn't master yet).
  pages:
    needs: build-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    uses: leon-lourenco/ci-templates/.github/workflows/pages-jacoco.yml@master
    with:
      java-version: '26'
