name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      # Handles both the dependency cache and Gradle's own build cache — faster than rolling
      # a manual actions/cache step, and it's the action the Gradle team maintains themselves.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Compiles every module, runs every test, and generates every module's JaCoCo report
      # (all three are wired into the `check`/`build` task via the root build.gradle.kts).
      # JMH benchmarks are deliberately NOT run here: shared CI runners have noisy, inconsistent
      # performance, so a benchmark number from this environment wouldn't mean anything — that's
      # exactly why the numbers quoted in every module's README come from a real local run
      # instead. `./gradlew jmh` stays a manual, on-demand command.
      - name: Build and test every module
        run: ./gradlew build --console=plain

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/test/html'
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 14
